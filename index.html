<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCR Binder Design</title>
<style>
:root{
  --binder:#1C6F6A;--binder-l:#DDEFEE;--mhc:#9DBDB8;--peptide:#B85A3C;
  --ink:#16302e;--ink2:#425a57;--muted:#7d9995;--line:#e2ecea;
  --surface:#fff;--panel:#f5faf9;--panel2:#eef5f4;--classI:#1C6F6A;--classII:#B85A3C;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);line-height:1.55;margin:0;background:#fbfdfc;}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px 90px;position:relative;}
h1{font-size:29px;font-weight:750;letter-spacing:-.02em;margin:30px 0 5px;padding-right:90px;}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px;}
.sub{color:var(--ink2);font-size:15px;margin:0 0 6px;}
.lede{color:var(--ink2);font-size:15px;max-width:840px;}
.section{margin-top:42px;padding-top:24px;border-top:1px solid var(--line);}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--binder);margin-bottom:6px;}
.note{font-size:13px;color:var(--muted);margin-top:10px;}
.langtog{position:absolute;right:22px;top:32px;font:700 13px/1 inherit;color:var(--binder);background:#fff;
  border:1.5px solid var(--binder);border-radius:20px;padding:8px 16px;cursor:pointer;z-index:10;}
.langtog:hover{background:var(--binder);color:#fff;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 2px;}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;}
.tile .k{font-size:29px;font-weight:760;letter-spacing:-.02em;line-height:1;}
.tile .l{font-size:12.5px;color:var(--ink2);margin-top:7px;}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px;}
.explorer{display:grid;grid-template-columns:290px 1fr;gap:20px;margin-top:20px;}
.nav{align-self:start;position:sticky;top:14px;}
.navfilter{display:flex;gap:6px;margin-bottom:10px;}
.fbtn{font:600 12.5px/1 inherit;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;}
.fbtn.on{background:var(--binder);color:#fff;border-color:var(--binder);}
.navlist{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;}
.nitem{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;}
.nitem:last-child{border-bottom:none;}.nitem:hover{background:var(--panel);}.nitem.sel{background:var(--binder-l);}
.nitem .pm{font-size:13px;font-weight:700;letter-spacing:-.01em;}
.nitem .mm{font-size:11.5px;color:var(--muted);}
.nitem .row2{display:flex;align-items:center;gap:8px;margin-top:6px;}
.nitem .bar{flex:1;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;}
.nitem .bar i{display:block;height:100%;border-radius:3px;}
.nitem .bv{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.chip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;}
.chipI{color:var(--classI);background:#eff7f6;}.chipII{color:var(--classII);background:#fbf1ed;}
.nct{position:absolute;right:11px;top:10px;font-size:10.5px;color:var(--muted);font-weight:700;}
.main{min-width:0;}
.thead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.thead .tp{font-size:22px;font-weight:750;letter-spacing:-.01em;}
.thead .tm{font-size:15px;color:var(--muted);font-weight:600;}
.tag{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:#fff;}
.tag.cI{color:var(--classI);border-color:#bfdedb;background:#eff7f6;}.tag.cII{color:var(--classII);border-color:#f0d3c8;background:#fbf1ed;}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;}
.pill{font:650 12.5px/1 inherit;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer;font-variant-numeric:tabular-nums;}
.pill.sel{background:var(--binder);color:#fff;border-color:var(--binder);}.pill .pr{opacity:.7;font-weight:600;}
.af3{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:12px;}
#stage{position:relative;height:440px;background:radial-gradient(120% 120% at 30% 10%,#fff 0%,#f0f6f5 70%,#e7f0ee 100%);border:1px solid var(--line);border-radius:15px;overflow:hidden;}
#viewer{position:absolute;inset:0;}
.toolbar{position:absolute;left:11px;top:11px;display:flex;gap:5px;flex-wrap:wrap;z-index:5;}
.btn{font:600 11.5px/1 inherit;color:var(--ink2);background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;}
.btn:hover{border-color:var(--binder);color:var(--binder);}.btn.on{background:var(--binder);color:#fff;border-color:var(--binder);}
.legend3d{position:absolute;left:11px;bottom:11px;display:flex;gap:12px;font-size:11.5px;z-index:5;background:rgba(255,255,255,.88);padding:6px 10px;border-radius:8px;border:1px solid var(--line);}
.legend3d b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle;}
.paecard{border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px;}
.paecard h4{margin:0 0 3px;font-size:13px;font-weight:700;}
.paecard .pd{font-size:11px;color:var(--muted);margin:0 0 8px;}
.paecard img{width:100%;height:auto;border-radius:6px;display:block;}
.paescale{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-top:7px;}
.paescale .grad{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#00441b,#238b45,#66c2a4,#ccece6,#f7fcfd);}
.conf{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cf{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;}
.cf .cv{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1;}
.cf .cl{font-size:11px;color:var(--ink2);margin-top:4px;}
.metrics{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;}
.mgrid{display:flex;flex-wrap:wrap;gap:16px 26px;}
.mi{font-size:13px;}.mi .mk{color:var(--ink2);}.mi .mv{font-weight:750;font-variant-numeric:tabular-nums;}
.seq{margin-top:11px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11px;line-height:1.5;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;word-break:break-all;}
.seq b{color:var(--binder);}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:24px 30px;margin-top:22px;}
.chart{min-width:0;}.chart.full{grid-column:1/-1;}
.chart h3{font-size:15px;font-weight:700;margin:0 0 2px;}
.chart .cd{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
.chart svg{width:100%;height:auto;overflow:visible;}
.axlab{font-size:11px;fill:var(--muted);}.val{font-size:11.5px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums;}
.tick{stroke:var(--line);stroke-width:1;}.baseline{stroke:#cfe0dd;stroke-width:1;}.clabel{font-size:12px;fill:var(--ink2);}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:16px;}
table.t th,table.t td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
table.t th:first-child,table.t td:first-child{text-align:left;}
table.t thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:1.5px solid #cfe0dd;}
table.t tbody tr:hover{background:var(--panel);}table.t .hl{font-weight:750;color:var(--binder);}
.tip{position:fixed;pointer-events:none;z-index:99;background:#16302e;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.foot{margin-top:20px;font-size:12.5px;color:var(--muted);max-width:880px;}.foot b{color:var(--ink2);}
/* --- results sections --- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-top:18px;}
.rcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);}
.rcard h4{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.rcard .big{font-size:26px;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15;}
.rcard .sm{font-size:12.5px;color:var(--ink2);margin-top:3px;}
.prov{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:#8a5a12;background:#fdf3e0;border:1px solid #f0dcb4;border-radius:20px;padding:3px 10px;}
.warnbox{border-left:3px solid #d9a441;background:#fdf9f1;padding:12px 14px;border-radius:0 8px 8px 0;margin-top:14px;font-size:13.5px;color:var(--ink2);}
.warnbox b{color:var(--ink);}
.tierbar{display:flex;align-items:center;gap:9px;}
.tierbar .track{position:relative;flex:1;height:9px;background:var(--panel2);border-radius:5px;min-width:90px;}
.tierbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--binder);border-radius:5px;}
.tierbar .ci{position:absolute;top:3px;height:3px;background:var(--muted);opacity:.55;border-radius:2px;}
.tierbar .v{font-size:13px;font-weight:750;color:var(--binder);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;}
.seqm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;}
@media(max-width:900px){.explorer{grid-template-columns:1fr;}.af3{grid-template-columns:1fr;}.charts{grid-template-columns:1fr;}.stats{grid-template-columns:repeat(2,1fr);}.nav{position:static;}}
</style>
</head>
<body>
<div class="wrap">
  <button class="langtog" id="langtog">EN</button>
  <h1 data-i="h1"></h1>
  <p class="sub" data-i="sub"></p>
  <p class="lede" data-ihtml="lede"></p>

  <div class="stats" id="stats"></div>

  <div class="section">
    <div class="eyebrow" data-i="ey1"></div>
    <h2 data-i="h2_1"></h2>
    <p class="cd" style="color:var(--ink2);font-size:14px;margin:4px 0 0" data-ihtml="hint1"></p>
    <div id="funnel" style="margin:14px 0 2px"></div>
    <div class="explorer">
      <aside class="nav">
        <div class="navfilter">
          <button class="fbtn on" data-f="all" data-i="f_all"></button>
          <button class="fbtn" data-f="I">Class I</button>
          <button class="fbtn" data-f="II">Class II</button>
        </div>
        <div class="navlist" id="navlist"></div>
      </aside>
      <div class="main">
        <div class="thead" id="thead"></div>
        <div class="pills" id="pills"></div>
        <div class="af3">
          <div>
            <div id="stage">
              <div class="toolbar">
                <button class="btn on" id="mRole" data-i="btn_role"></button>
                <button class="btn" id="mPlddt" data-i="btn_plddt"></button>
                <button class="btn on" id="tPep" data-i="btn_pep"></button>
                <button class="btn" id="tSpin" data-i="btn_spin"></button>
                <button class="btn" id="tReset" data-i="btn_reset"></button>
              </div>
              <div class="legend3d" id="leg3d">
                <span><b style="background:var(--binder)"></b><span data-i="leg_binder"></span></span>
                <span><b style="background:var(--mhc)"></b>MHC</span>
                <span><b style="background:var(--peptide)"></b><span data-i="leg_pep"></span></span>
              </div>
              <div id="viewer"></div>
            </div>
          </div>
          <div class="paecol">
            <div class="paecard">
              <h4>Predicted Aligned Error (PAE)</h4>
              <p class="pd" data-i="pae_desc"></p>
              <img id="paeimg" alt="PAE">
              <div class="paescale"><span data-i="pae_lo"></span><span class="grad"></span><span data-i="pae_hi"></span></div>
            </div>
            <div class="conf" id="conf"></div>
          </div>
        </div>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="eyebrow" data-i="ey2"></div>
    <h2 data-i="h2_2"></h2>
    <p class="lede" style="font-size:14.5px" data-ihtml="lede2"></p>
    <div class="charts">
      <div class="chart"><h3 data-i="ch_cov"></h3><p class="cd" data-i="ch_cov_d"></p><div id="c_cov"></div></div>
      <div class="chart"><h3 data-i="ch_dist"></h3><p class="cd" data-i="ch_dist_d"></p><div id="c_dist"></div></div>
      <div class="chart"><h3 data-i="ch_cls"></h3><p class="cd" data-i="ch_cls_d"></p><div id="c_cls"></div></div>
      <div class="chart"><h3 data-i="ch_cat"></h3><p class="cd" data-i="ch_cat_d"></p><div id="c_cat"></div></div>
      <div class="chart full"><h3 data-i="ch_ba"></h3><p class="cd" data-i="ch_ba_d"></p><div id="c_ba"></div></div>
    </div>
  </div>

  <div class="section">
    <div class="eyebrow" data-i="ey_r1"></div>
    <h2 data-i="h2_r1"></h2>
    <p class="lede" style="font-size:14.5px" data-ihtml="lede_r1"></p>
    <div class="rgrid" id="r_tiles"></div>
    <h3 style="font-size:15px;font-weight:700;margin:26px 0 0" data-i="r1_tiers"></h3>
    <p class="cd" style="font-size:12.5px;color:var(--muted);margin:2px 0 0" data-i="r1_tiers_d"></p>
    <div style="overflow-x:auto"><table class="t" id="tierT"></table></div>
    <h3 style="font-size:15px;font-weight:700;margin:26px 0 0" data-i="r1_cat"></h3>
    <p class="cd" style="font-size:12.5px;color:var(--muted);margin:2px 0 0" data-i="r1_cat_d"></p>
    <div style="overflow-x:auto"><table class="t" id="catT"></table></div>
    <h3 style="font-size:15px;font-weight:700;margin:26px 0 0" data-i="r1_hits"></h3>
    <p class="cd" style="font-size:12.5px;color:var(--muted);margin:2px 0 0" data-i="r1_hits_d"></p>
    <div style="overflow-x:auto"><table class="t" id="hitT"></table></div>
    <p class="note" data-ihtml="r1_note"></p>
  </div>

  <div class="section">
    <div class="eyebrow" data-i="ey_r2"></div>
    <h2 data-i="h2_r2"></h2>
    <p class="lede" style="font-size:14.5px" data-ihtml="lede_r2"></p>
    <div class="rgrid" id="r_checks"></div>
    <h3 style="font-size:15px;font-weight:700;margin:26px 0 0" data-i="r2_pos"></h3>
    <p class="cd" style="font-size:12.5px;color:var(--muted);margin:2px 0 6px" data-i="r2_pos_d"></p>
    <div style="overflow-x:auto"><table class="t" id="posT"></table></div>
    <div class="warnbox" data-ihtml="r2_warn"></div>
    <h3 style="font-size:15px;font-weight:700;margin:26px 0 0" data-i="r2_local"></h3>
    <p class="cd" style="font-size:12.5px;color:var(--muted);margin:2px 0 0" data-i="r2_local_d"></p>
    <div style="overflow-x:auto"><table class="t" id="localT"></table></div>
  </div>

  <div class="section">
    <div class="eyebrow" data-i="ey3"></div>
    <h2 data-i="h2_3"></h2>
    <p class="lede" style="font-size:14.5px" data-ihtml="lede3"></p>
    <table class="t" id="timeT"><thead><tr>
      <th data-i="th_level"></th><th data-i="th_rate"></th><th data-i="th_jobs"></th>
      <th data-i="th_cfm"></th><th data-i="th_e2e"></th><th data-i="th_cost"></th></tr></thead><tbody></tbody></table>
    <p class="note" data-ihtml="note_time"></p>
  </div>

  <div class="section">
    <div class="eyebrow" data-i="ey_r3"></div>
    <h2 data-i="h2_r3"></h2>
    <div id="caveats"></div>
  </div>

  <p class="foot" data-ihtml="foot"></p>
</div>
<div class="tip" id="tip"></div>

<script src="assets/3Dmol-min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/cifs.js"></script>
<script>
const DATA=window.DATA, CIFS=window.CIFS;
const Cc={binder:'#1C6F6A',mhc:'#9DBDB8',peptide:'#B85A3C',classI:'#1C6F6A',classII:'#B85A3C',muted:'#7d9995'};
const tip=document.getElementById('tip');
const fmt=v=>(v==null?'—':(+v).toFixed(3));
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';}
function hideTip(){tip.style.opacity=0;}
const NT=DATA.meta.n_targets, NH=DATA.meta.n_hits, cov6=DATA.coverage['0.6'], covPct=(100*cov6/187).toFixed(0);
const clsRatio=(DATA.cls.II.rate07/DATA.cls.I.rate07).toFixed(1);

/* ---------------- i18n ---------------- */
let L='zh';
const I18N={
 zh:{
  h1:'TCR Binder Design — 设计成果展示',
  sub:'CFM v3 从头生成 · AlphaFold3 验证 · 按 pMHC 靶点整理',
  lede:'下面每个都是模型<b>从头生成</b>的 TCR binder 序列,经 AlphaFold3 独立折叠验证与目标 pMHC 形成高置信度复合物。左侧按 <b>pMHC 靶点</b>浏览,每个靶点内的设计按 composite ipTM 排序。每个设计给出与 AlphaFold Server 相同的 <b>3D 结构 + PAE 预测误差图</b>。',
  ey1:'交互式浏览 · ALPHAFOLD3 结果',
  h2_1:'合格设计(composite ipTM ≥ 0.7 且真实结合在肽上),按 pMHC 靶点',
  fn_title:'真实结合位置分流(基于 AF3 三维坐标,非 ipTM)',
  fn_scored:'个 AF3 已评估设计', fn_on:'贴合肽', fn_edge:'边缘接触', fn_off:'未接触肽',
  fn_accept:'正确命中 (accept)', fn_redesign:'待 MPNN 重设计', fn_reject:'位置错误 · 剔除',
  hint1:'左栏选靶点,中间选该靶点下的设计。<span style="color:var(--peptide);font-weight:650">珊瑚色</span>=抗原肽,<span style="color:var(--binder);font-weight:650">青色</span>=设计 binder。',
  f_all:'全部', btn_role:'按角色上色', btn_plddt:'按 pLDDT 上色', btn_pep:'肽棒状', btn_spin:'旋转', btn_reset:'复位',
  leg_binder:'设计 binder', leg_pep:'抗原肽',
  pae_desc:'AlphaFold3 预测的对齐误差 · 越绿=误差越低=越可信', pae_lo:'低', pae_hi:'高 (Å)',
  ey2:'成果概览', h2_2:'生成质量与靶点覆盖',
  lede2:'在 187 个 pMHC 基准靶点上,每靶点生成 5–10 个候选并全部经 AF3 打分(共 2188 个)。下列图表汇总命中分布、靶点覆盖、Class I/II 差异,及序列再设计带来的提升。',
  ch_cov:'靶点覆盖率', ch_cov_d:'187 个基准靶点中至少 1 个命中的比例',
  ch_dist:'composite ipTM 分布', ch_dist_d:'全部 2188 个 AF3 已评估候选',
  ch_cls:'Class I vs Class II 命中率', ch_cls_d:'composite ≥ 0.7 的比例(含均值)',
  ch_cat:'各类别命中数', ch_cat_d:'composite ≥ 0.7,按抗原类别',
  ch_ba:'序列再设计:v1 → v2 前后对比', ch_ba_d:'重设计后越过 0.7 的设计(珊瑚=原始 v1,青=再设计 v2)',
  ey3:'生成成本', h2_3:'获得一个 binder 需要多少算力',
  lede3:'生成本身极便宜(RTX 4070,1.27 s/候选);真实成本在 AF3 验证。下表按质量等级给出平均需要几个候选及折算 A100 的时间/成本。',

/* ---------------- triage funnel (position truth, from DB labels) ---------------- */
const POSCOL={on_peptide:'#2e9e6b',touching:'#d9a441',off_peptide:'#d1495b'};
function posName(p){return {on_peptide:t('fn_on'),touching:t('fn_edge'),off_peptide:t('fn_off')}[p]||p||'—';}
function posLabelHTML(b){
  if(!b||!b.position) return '—';
  const d=(b.min_dist_bp!=null)?' · '+b.min_dist_bp.toFixed(1)+'Å':'';
  const n=(b.n_pep_contact!=null)?' · '+b.n_pep_contact+(L==='zh'?' 残基':'res'):'';
  return `<span style="color:${POSCOL[b.position]||'#888'};font-weight:700">●</span> ${posName(b.position)}${d}${n}`;
}
function drawFunnel(){
  const T=DATA.triage; const el=document.getElementById('funnel'); if(!T||!el){return;}
  const tot=T.on_peptide+T.touching+T.off_peptide||1;
  const seg=(v,c)=>`<i style="display:block;height:100%;width:${100*v/tot}%;background:${c}"></i>`;
  const chip=(k,v,c)=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)">
      <b style="width:9px;height:9px;border-radius:2px;background:${c}"></b>${k} <b style="color:var(--ink)">${v}</b></span>`;
  el.innerHTML=
    `<div style="font-size:13px;color:var(--ink2);margin-bottom:6px">${t('fn_title')} · <b style="color:var(--ink)">${T.n_scored}</b> ${t('fn_scored')}</div>
     <div style="display:flex;height:16px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)">
       ${seg(T.on_peptide,POSCOL.on_peptide)}${seg(T.touching,POSCOL.touching)}${seg(T.off_peptide,POSCOL.off_peptide)}</div>
     <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px">
       ${chip('✓ '+t('fn_accept'),T.accept,POSCOL.on_peptide)}
       ${chip('⟳ '+t('fn_redesign'),T.redesign,POSCOL.touching)}
       ${chip('✗ '+t('fn_reject'),T.reject,POSCOL.off_peptide)}</div>`;
}

function drawTiles(){
  const tt=[
    {k:NH,l:t('t1l'),s:t('t1s')},

let viewer=null, curT=null, curB=null, colorMode='role', pepSticks=true, spinning=false, filter='all';
function plddtColor(b){if(b>=90)return 0x2166ac;if(b>=70)return 0x67a9cf;if(b>=50)return 0xfdb863;return 0xe08214;}
function buildNav(){
  const list=DATA.targets.filter(x=>filter==='all'||x.cls===filter);
  document.getElementById('navlist').innerHTML=list.map(x=>{
    const w=Math.max(6,Math.round(((x.best-0.65)/0.30)*100));
    const col=x.cls==='I'?Cc.classI:Cc.classII;
    return `<div class="nitem" data-key="${x.key}">
      <span class="nct">${x.n>1?x.n+'×':''}</span>
      <div class="pm">${x.peptide}</div><div class="mm">${x.mhc} · ${catName(x.category)}</div>
      <div class="row2"><span class="chip chip${x.cls}">${x.cls}</span>
        <span class="bar"><i style="width:${w}%;background:${col}"></i></span>
        <span class="bv" style="color:${col}">${fmt(x.best)}</span></div></div>`;}).join('');
  document.querySelectorAll('.nitem').forEach(el=>el.onclick=()=>selectTarget(el.dataset.key));
}
function selectTarget(key){
  curT=DATA.targets.find(x=>x.key===key); if(!curT)return;
  document.querySelectorAll('.nitem').forEach(el=>el.classList.toggle('sel',el.dataset.key===key));
  const clsTag=curT.cls==='I'?'<span class="tag cI">Class I</span>':'<span class="tag cII">Class II</span>';

function renderStructure(d){
  if(!viewer) viewer=$3Dmol.createViewer(document.getElementById('viewer'),{backgroundColor:'white',antialias:true});
  viewer.clear(); const cif=CIFS[d.id]; if(!cif)return;
  viewer.addModel(cif,'cif'); viewer.setStyle({},{cartoon:{color:'#dfeae8'}});
  for(const ch in d.roles){const r=d.roles[ch];
    if(colorMode==='plddt'){viewer.setStyle({chain:ch},{cartoon:{colorfunc:a=>plddtColor(a.b)}});}
    else{const col=r==='binder'?Cc.binder:(r==='peptide'?Cc.peptide:Cc.mhc);
      viewer.setStyle({chain:ch},{cartoon:{color:col,thickness:r==='binder'?0.9:0.6,opacity:r==='mhc'?0.92:1}});}}
  const pep=Object.keys(d.roles).find(k=>d.roles[k]==='peptide');
  if(pepSticks&&pep){viewer.addStyle({chain:pep},colorMode==='plddt'?{stick:{radius:0.22}}:{stick:{color:Cc.peptide,radius:0.22}});}
  viewer.zoomTo();viewer.render();viewer.zoom(1.15,500); if(spinning)viewer.spin('y');
}

    tile(t('rc_orth'), RES.boltz.auroc.toFixed(3), t('rc_orth_s').replace('{n}',RES.boltz.n)),
    tile(t('rc_prior'), pct(P.mhc.rate)+' → '+pct(P.gauss.rate), t('rc_prior_s')),
    tile(t('rc_speed'), '~'+RES.speed.cfm+' s', t('rc_speed_s').replace('{p}',RES.speed.share))
  ].join('');

  // ---- 位置验证表 ----
  document.getElementById('posT').innerHTML=
    `<thead><tr><th>${t('th_tier')}</th><th>${t('th_posver')}</th><th>${t('th_iptmonly')}</th></tr></thead>
     <tbody>${RES.pos.ver.map(x=>`<tr><td class="hl">${x.k} · ${t('tier_'+x.k)}</td>
        <td style="font-weight:750">${pct(x.v)}</td><td style="color:var(--muted)">${pct(x.ip)}</td></tr>`).join('')}
      <tr><td class="hl">${t('th_triage')}</td><td colspan="2" style="text-align:left">
        <span style="color:${POSCOL.on_peptide};font-weight:700">●</span> ${t('fn_accept')} <b>${RES.pos.accept}</b> &nbsp;
        <span style="color:${POSCOL.touching};font-weight:700">●</span> ${t('fn_redesign')} <b>${RES.pos.redesign}</b> &nbsp;
        <span style="color:${POSCOL.off_peptide};font-weight:700">●</span> ${t('fn_reject')} <b>${RES.pos.reject}</b></td></tr></tbody>`;

  // ---- 本地 AF3 表 ----
  const M=RES.local.modes;
  document.getElementById('localT').innerHTML=
    `<thead><tr><th>${t('th_mode')}</th><th>T0</th><th>T1</th><th>T2</th><th>${t('th_ovi')}</th><th>${t('th_lo3')}</th></tr></thead>
     <tbody>${M.map(x=>`<tr><td class="hl">${x.k}${x.head?` <span class="prov" style="background:var(--binder-l);color:var(--binder);border-color:#bfdedb">${t('th_head')}</span>`:''}</td>
        <td>${pct(x.t0)}</td><td>${pct(x.t1)}</td><td>${pct(x.t2)}</td>
        <td>${x.iptm.toFixed(3)}</td><td${x.lo3>50?' style="color:'+POSCOL.off_peptide+';font-weight:700"':''}>${pct(x.lo3)}</td></tr>`).join('')}</tbody>`;

  // ---- 口径与限制 ----
  document.getElementById('caveats').innerHTML=t('cav_html');
}

function drawTiming(){
  document.querySelector('#timeT tbody').innerHTML=DATA.timing.map(x=>{
    const e2e=x.e2e_min>=60?(x.e2e_min/60).toFixed(1)+' '+t('hrs'):x.e2e_min+' '+t('mins');
    return `<tr><td class="hl">composite ≥ ${x.thr}</td><td>${x.rate}%</td><td>~${Math.round(x.jobs_per_hit)}</td><td>~${x.cfm_s} ${t('secs')}</td><td>~${e2e}</td><td>~$${x.cost.toFixed(1)}</td></tr>`;}).join('');
}

/* ---------------- language switch ---------------- */
function setLang(l){
  L=l; applyStatic(); drawFunnel(); drawTiles(); drawCharts(); drawTiming(); drawResults();
  const bid=curB?curB.id:null, key=curT?curT.key:DATA.targets[0].key;
  buildNav(); selectTarget(key); if(bid)selectBinder(bid);
}
document.getElementById('langtog').onclick=()=>setLang(L==='zh'?'en':'zh');

/* ---------------- init ---------------- */
applyStatic(); drawFunnel(); drawTiles(); drawCharts(); drawTiming(); drawResults();
buildNav(); selectTarget(DATA.targets[0].key);
</script>
</body>
</html>
